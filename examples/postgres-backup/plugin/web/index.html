<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PostgreSQL 备份</title>
  <link rel="stylesheet" href="./style.css">
  <script defer src="./app.js"></script>
</head>
<body>
  <main id="app" data-view="sources" data-step="list">
    <header class="app-header">
      <h1>PostgreSQL 备份</h1>
      <button id="sources-toggle" type="button" aria-expanded="false" aria-controls="navigation">
        <svg class="icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><line x1="8" x2="21" y1="6" y2="6"/><line x1="8" x2="21" y1="12" y2="12"/><line x1="8" x2="21" y1="18" y2="18"/><line x1="3" x2="3.01" y1="6" y2="6"/><line x1="3" x2="3.01" y1="12" y2="12"/><line x1="3" x2="3.01" y1="18" y2="18"/></svg>
        <span>数据源列表</span>
      </button>
      <nav id="menu" aria-label="插件菜单">
        <button type="button" data-view="sources">
          <svg class="icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5V19A9 3 0 0 0 21 19V5"/><path d="M3 12A9 3 0 0 0 21 12"/></svg>
          <span>数据库</span>
        </button>
        <button type="button" data-view="schedules">
          <svg class="icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          <span>定时任务</span>
        </button>
        <button type="button" data-view="history">
          <svg class="icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect width="20" height="5" x="2" y="3" rx="1"/><path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8"/><path d="M10 12h4"/></svg>
          <span>备份记录</span>
        </button>
        <button type="button" data-view="restores">
          <svg class="icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
          <span>恢复记录</span>
        </button>
      </nav>
    </header>
    <div class="workspace">
      <aside id="navigation" class="navigation" aria-labelledby="sources-title">
        <div class="nav-title">
          <h2 id="sources-title">数据源</h2>
          <button id="add-source" type="button" aria-label="新建数据源" title="新建数据源">
            <svg class="icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
          </button>
        </div>
        <div class="search-field">
          <svg class="icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input id="source-search" type="search" aria-label="搜索数据源" placeholder="搜索数据源" autocomplete="off">
        </div>
        <div id="sources" class="items"></div>
      </aside>
      <div id="view-loading" class="view-state" role="status" hidden>
        <span class="spinner" aria-hidden="true"></span>正在加载…
      </div>
      <div id="view-error" class="view-state" hidden>
        <p id="view-error-message" class="error" role="alert"></p>
        <button id="retry-view" type="button">
          <svg class="icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
          <span>重新加载</span>
        </button>
      </div>
      <section id="databases" class="pane" aria-label="数据库"></section>
      <section id="detail" class="pane" aria-label="数据库详情"></section>
      <section id="page" class="pane" aria-label="当前视图" hidden></section>
    </div>
    <div id="toast" role="status" aria-live="polite" aria-atomic="true"><p></p></div>
  </main>
  <dialog id="dialog" aria-labelledby="dialog-title">
    <form id="dialog-form">
      <div class="dialog-body">
        <h2 id="dialog-title"></h2>
        <div id="dialog-content"></div>
      </div>
      <p id="dialog-status" role="status" hidden></p>
      <div class="actions dialog-actions">
        <button id="cancel" type="button">取消</button>
        <button id="confirm" type="submit" class="primary"></button>
      </div>
    </form>
  </dialog>
</body>
</html>
