name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        env:
          GOWORK: "off"
        run: go vet ./...

      - name: Test
        env:
          GOWORK: "off"
          CGO_ENABLED: "0"
        run: go test ./...

      - name: Build
        env:
          GOWORK: "off"
          CGO_ENABLED: "0"
        run: go build -trimpath -o ext ./cmd/ext
