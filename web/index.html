<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ext 扩展</title>
  <link rel="stylesheet" href="./style.css">
  <script defer src="./app.js"></script>
</head>
<body>
  <header class="toolbar"><div class="toolbar-content"><span class="brand">Extension Host <span>控制台</span></span><nav class="top-nav" aria-label="主导航"><button type="button" data-page="plugins" aria-current="page">插件管理</button><button type="button" data-page="settings">宿主设置</button></nav><button id="refresh" type="button">刷新</button></div></header>
  <main>
    <p id="notice" class="feedback" role="status"></p>
    <div id="plugins-page">
    <div class="page-heading"><div><h1>插件管理</h1><p class="page-description">管理插件、运行状态与宿主设置。</p></div><button id="open-install" class="primary" type="button">安装插件</button></div>
    <section class="overview" aria-label="插件概览">
      <div><span>已安装</span><strong id="total-count">—</strong></div>
      <div><span>运行中</span><strong id="running-count">—</strong></div>
      <div><span>需要关注</span><strong id="attention-count">—</strong></div>
    </section>

    <section class="plugin-section" aria-labelledby="list-title">
      <div class="section-head"><div><h2 id="list-title">插件</h2><span id="count" class="caption"></span></div></div>
      <div class="filters"><label class="field"><span>搜索插件</span><input id="search" type="search" placeholder="按名称或 ID 搜索"></label><label class="field"><span>状态</span><select id="status-filter"><option value="all">全部状态</option><option value="running">运行中</option><option value="stopped">已停止</option><option value="disabled">未启用</option><option value="failed">启动失败</option></select></label></div>
      <p id="list-state" class="feedback" role="status">正在加载插件…</p><div id="plugins" class="plugins"></div>
    </section>
    </div>
    <section id="settings-page" hidden class="home-settings" aria-labelledby="home-title"><h1 id="home-title">宿主设置</h1><p class="page-description">管理独立宿主的默认页面。</p><div class="settings-card"><h2>宿主首页</h2><p class="caption">选择访问宿主根地址时打开的页面。</p>
      <form id="home-form"><div id="home-controls" class="home-controls"><fieldset class="home-choices" aria-describedby="home-hint"><legend>首页插件</legend><div id="home-plugin"></div></fieldset><button class="primary" type="submit" disabled>保存首页</button></div><p id="home-hint" class="caption"></p><p id="home-status" class="feedback" role="status"></p></form></div>
    </section>
  </main>
  <dialog id="install-dialog" aria-labelledby="install-title"><form id="install-form"><h2 id="install-title">安装插件</h2><p class="caption">选择插件 ZIP 文件，安装后可在列表中启用。</p><label class="field" for="package">插件 ZIP 文件</label><input id="package" name="package" type="file" accept=".zip,application/zip" required><p id="install-error" class="feedback error" role="alert"></p><div class="actions dialog-actions"><button id="cancel-install" type="button">取消</button><button class="primary" type="submit">安装</button></div></form></dialog>

  <dialog id="uninstall-dialog" aria-labelledby="uninstall-title" aria-describedby="uninstall-description">
    <form id="uninstall-form">
      <h2 id="uninstall-title"></h2>
      <p id="uninstall-description">插件包和配置会被移除。业务数据默认保留。</p>
      <label class="check">
        <input id="purge" type="checkbox" aria-describedby="purge-warning">
        同时删除插件业务数据
      </label>
      <p id="purge-warning" class="warning" role="status" hidden>删除后无法恢复插件业务数据，包括备份历史和保存在插件目录中的备份文件。</p>
      <p id="uninstall-error" class="feedback error" role="alert"></p>
      <div class="actions dialog-actions">
        <button id="cancel-uninstall" type="button" autofocus>取消</button>
        <button class="danger" type="submit">卸载</button>
      </div>
    </form>
  </dialog>
</body>
</html>
