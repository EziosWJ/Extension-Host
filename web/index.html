<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>godesk-ext 扩展</title>
  <link rel="stylesheet" href="./style.css">
  <script defer src="./app.js"></script>
</head>
<body>
  <header class="toolbar">
    <div class="toolbar-content">
      <h1>扩展</h1>
      <button id="refresh" type="button" aria-label="刷新扩展列表">刷新</button>
    </div>
  </header>
  <main>
    <section class="install" aria-labelledby="install-title">
      <h2 id="install-title">安装插件包</h2>
      <form id="install-form">
        <label for="package">插件 ZIP 文件</label>
        <div class="install-controls">
          <input id="package" name="package" type="file" accept=".zip,application/zip" required>
          <button class="primary" type="submit">安装</button>
        </div>
      </form>
    </section>

    <p id="notice" class="feedback" role="status"></p>

    <section aria-labelledby="list-title">
      <div class="section-head">
        <h2 id="list-title">已安装插件</h2>
        <span id="count" class="caption"></span>
      </div>
      <p id="list-state" class="feedback" role="status">正在加载插件…</p>
      <div id="plugins" class="plugins"></div>
    </section>
  </main>

  <dialog id="uninstall-dialog" aria-labelledby="uninstall-title" aria-describedby="uninstall-description">
    <form id="uninstall-form">
      <h2 id="uninstall-title"></h2>
      <p id="uninstall-description">插件包和配置会被移除。业务数据默认保留。</p>
      <label class="check">
        <input id="purge" type="checkbox" aria-describedby="purge-warning">
        同时删除插件业务数据
      </label>
      <p id="purge-warning" class="warning" role="status" hidden>删除后无法恢复插件业务数据，包括备份历史和保存在插件目录中的备份文件。</p>
      <p id="uninstall-error" class="feedback error" role="alert"></p>
      <div class="actions dialog-actions">
        <button id="cancel-uninstall" type="button" autofocus>取消</button>
        <button class="danger" type="submit">卸载</button>
      </div>
    </form>
  </dialog>
</body>
</html>
