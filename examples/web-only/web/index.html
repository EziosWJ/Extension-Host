<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Web-only Example</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: Canvas;
      color: CanvasText;
      font: 16px/1.6 ui-sans-serif, system-ui, sans-serif;
    }
    main {
      width: min(560px, calc(100% - 32px));
      padding: 28px;
      border: 1px solid color-mix(in srgb, CanvasText 18%, transparent);
      border-radius: 14px;
    }
    h1 { margin: 0 0 10px; font-size: 26px; }
    p { margin: 0 0 10px; }
    code { padding: 1px 5px; border-radius: 5px; background: color-mix(in srgb, CanvasText 8%, transparent); }
  </style>
</head>
<body>
  <main>
    <h1>Web-only 插件已运行</h1>
    <p>这个包只声明了 <code>entry.web</code>，没有任何 Lua 后端。</p>
    <p>宿主会正常提供本页和静态资源；访问 <code>/extensions/com.godesk.webonly/api/</code> 会返回明确的「没有 Lua 入口」错误。</p>
  </main>
</body>
</html>
