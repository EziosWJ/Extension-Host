<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PostgreSQL 备份</title>
  <link rel="stylesheet" href="./style.css">
  <script defer src="./app.js"></script>
</head>
<body>
  <header class="toolbar">
    <div class="toolbar-content">
      <div class="target">
        <h1>PostgreSQL 备份</h1>
        <p id="target">正在读取备份目标…</p>
      </div>
      <button id="submit" type="button" aria-describedby="target backup-state" aria-disabled="true">立即备份</button>
    </div>
  </header>
  <main>
    <p id="backup-state" class="feedback" role="status"></p>

    <details id="connection">
      <summary>数据库连接</summary>
      <form id="connection-form">
        <fieldset disabled>
          <div class="connection-fields">
            <label>主机<input name="host" required placeholder="127.0.0.1"></label>
            <label>端口<input name="port" type="number" min="1" max="65535" required></label>
            <label>数据库<input name="database" required></label>
            <label>用户<input name="username" required></label>
            <label class="password">密码<input name="password" type="password" autocomplete="new-password"></label>
          </div>
          <label id="clear-password" class="check" hidden>
            <input name="clearPassword" type="checkbox"> 清除已保存的密码
          </label>
        </fieldset>
        <button id="save-connection" type="submit" class="primary" aria-disabled="true">保存连接</button>
        <button id="retry-connection" type="button" hidden>重新读取连接</button>
        <p id="connection-notice" class="feedback" role="status"></p>
      </form>
    </details>

    <section class="history" aria-labelledby="history-title">
      <div class="history-head">
        <h2 id="history-title">备份历史</h2>
        <button id="refresh-history" type="button">刷新历史</button>
      </div>
      <p id="history-state" class="feedback" role="status">正在加载备份历史…</p>
      <ol id="jobs"></ol>
    </section>
  </main>

  <template id="job">
    <li class="job">
      <div class="job-head"><time></time><span class="badge"></span></div>
      <dl>
        <dt>目标</dt><dd class="job-target"></dd>
        <dt class="result-label">结果</dt><dd class="result"></dd>
      </dl>
    </li>
  </template>
</body>
</html>
